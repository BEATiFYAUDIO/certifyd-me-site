<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/images/certifyd-tab-icon.svg?v=20260601a" />
  <link rel="shortcut icon" type="image/svg+xml" href="/images/certifyd-tab-icon.svg?v=20260601a" />
  <link rel="apple-touch-icon" href="/images/certifyd-tab-icon.svg?v=20260601a" />
  <title>{{metaTitle}}</title>
  <meta name="description" content="{{metaDescription}}" />
  <meta name="author" content="{{author}}" />
  <link rel="canonical" href="{{canonicalUrl}}" />
  {{robotsMeta}}
  {{googleVerificationMeta}}
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{ogTitle}}" />
  <meta property="og:description" content="{{metaDescription}}" />
  <meta property="og:url" content="{{canonicalUrl}}" />
  <meta property="og:site_name" content="Certifyd" />
  <meta property="og:image" content="{{ogImage}}" />
  <meta property="article:published_time" content="{{publishedIso}}" />
  <meta property="article:modified_time" content="{{updatedIso}}" />
  <meta property="article:author" content="{{author}}" />
  {{articleTagMeta}}
  {{keywordMeta}}
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ogTitle}}" />
  <meta name="twitter:description" content="{{metaDescription}}" />
  <meta name="twitter:image" content="{{ogImage}}" />
  {{jsonLdScripts}}
  <style>
    :root{--bg-deep:#062337;--panel-strong:rgba(5,24,38,.74);--border:rgba(205,238,255,.24);--text:#e8ecf1;--muted:#b4bdc8;--brand:#ff8a00;--blue:#5f9fff;--wrap:980px;--pad:clamp(18px,4vw,48px)}*{box-sizing:border-box}html{background:var(--bg-deep);scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:linear-gradient(180deg,rgba(7,34,52,.96),rgba(8,55,78,.9)),radial-gradient(900px 620px at 14% -8%,rgba(95,159,255,.24),transparent 60%),radial-gradient(740px 520px at 90% 8%,rgba(255,138,0,.12),transparent 62%),var(--bg-deep);line-height:1.65}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}.skip-link{position:absolute;left:var(--pad);top:10px;z-index:100;transform:translateY(-140%);border-radius:999px;background:#000;color:#fff;padding:10px 14px;font-weight:900;transition:transform .18s ease}.skip-link:focus{transform:translateY(0)}:focus-visible{outline:3px solid var(--blue);outline-offset:4px;box-shadow:0 0 0 5px rgba(95,159,255,.28);border-radius:12px}.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding-inline:var(--pad)}header{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);background:rgba(6,35,55,.82);backdrop-filter:blur(16px)}.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand img{width:156px;height:auto}.nav-links{display:flex;gap:16px;align-items:center;color:#d8ecf8;font-size:.92rem}.nav-links a{opacity:.86}.nav-links a:hover{opacity:1;color:#fff}main{padding:clamp(44px,7vw,96px) 0}.eyebrow{margin:0 0 14px;color:var(--brand);font-size:.78rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font-size:clamp(3rem,8vw,6.6rem);line-height:.9;letter-spacing:-.08em;text-wrap:balance}.description{margin:22px 0 0;max-width:760px;color:#d8ecf8;font-size:clamp(1.08rem,2vw,1.38rem)}.article-meta{display:flex;flex-wrap:wrap;gap:9px;margin:28px 0 0;color:#d8ecf8}.chip{border:1px solid var(--border);border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.06);font-weight:800;font-size:.82rem}.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tag-list span{border:1px solid var(--border);border-radius:999px;padding:6px 9px;color:#d8ecf8;font-size:.78rem;font-weight:800}.article-hero-image{margin:36px 0;border:1px solid var(--border);border-radius:28px;overflow:hidden;background:#071421;box-shadow:0 30px 90px rgba(0,0,0,.34)}.article-hero-image img{width:100%;aspect-ratio:16/9;object-fit:cover}.article-image-credit{margin:0;padding:9px 14px;color:#bfd9e8;font-size:.82rem;background:rgba(0,0,0,.22)}.article-image-credit a{text-decoration:underline;text-underline-offset:3px}article{border:1px solid var(--border);border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.025)),var(--panel-strong);padding:clamp(24px,5vw,54px);box-shadow:0 30px 90px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.08)}article :first-child{margin-top:0}article h1{font-size:clamp(2rem,5vw,4rem)}article h2{margin:2em 0 .5em;font-size:clamp(1.7rem,3vw,2.45rem);line-height:1;letter-spacing:-.05em}article p,article li{color:#d8ecf8;font-size:1.04rem}article blockquote{margin:0 0 1.4em;padding:16px 18px;border-left:3px solid var(--brand);border-radius:14px;background:rgba(255,138,0,.08)}article blockquote p{margin:0;color:#fff;font-weight:800}article ul{padding-left:1.3em}footer{border-top:1px solid var(--border);padding:24px 0;color:#bfd9e8;background:rgba(5,24,38,.52)}@media(max-width:720px){.nav{min-height:68px}.brand img{width:142px}.nav-links{font-size:.84rem;gap:10px}main{padding-top:38px}article{border-radius:22px}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header><div class="wrap nav"><a class="brand" href="/"><img src="/images/certifyd_logo_transparent.svg" alt="Certifyd" /></a><nav class="nav-links" aria-label="Primary"><a href="/">Home</a><a href="/network.html">Network</a><a href="/blog/">Blog</a></nav></div></header>
  <main id="main"><section class="wrap"><p class="eyebrow">Certifyd Blog</p><h1>{{title}}</h1><p class="description">{{excerpt}}</p><div class="article-meta"><span class="chip">By {{author}}</span><span class="chip">Published {{publishedAt}}</span><span class="chip">Updated {{updatedAt}}</span></div>{{tags}}{{heroImage}}<article>{{body}}</article></section></main>
  <footer><div class="wrap"><a href="/blog/">Blog</a> · <a href="/feed.xml">RSS</a> · Certifyd</div></footer>
</body>
</html>
